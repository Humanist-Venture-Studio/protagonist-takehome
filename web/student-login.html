<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="color-scheme" content="light dark"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.32' cy='.3'%3E%3Cstop offset='0' stop-color='%232FC4B4'/%3E%3Cstop offset='.72' stop-color='%236D62FF'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3C/svg%3E"><title>Welcome · Protagonist</title><style>
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:1.5rem max(1rem,env(safe-area-inset-right)) 1.5rem max(1rem,env(safe-area-inset-left));background:#F4F4F6;color:#141418;font:400 .9375rem/1.45 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}[hidden]{display:none!important}
main{width:100%;max-width:24rem;display:grid;justify-items:center;gap:1rem;text-align:center}
.orb{width:3.5rem;height:3.5rem;border-radius:50%;background:radial-gradient(circle at 32% 30%,#2FC4B4,#6D62FF 72%)}
h1{margin:0;font-size:1.75rem;font-weight:700;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}p{margin:0;color:#5A5A66;overflow-wrap:anywhere}
.button,button{display:inline-flex;align-items:center;justify-content:center;min-height:2.75rem;padding:.5rem 1.25rem;border:0;border-radius:999px;background:#4A43D4;color:#fff;font:600 .9375rem/1.2 inherit;text-decoration:none;cursor:pointer}
a{color:#4A43D4}:focus-visible{outline:2px solid #4A43D4;outline-offset:2px}
@media (prefers-color-scheme:dark){body{background:#0D0D10;color:#F2F2F5}p{color:#A3A3AE}.button,button{background:#8F8AFF;color:#0D0D10}a{color:#8F8AFF}:focus-visible{outline-color:#8F8AFF}}
</style></head><body><main><span class="orb" aria-hidden="true"></span><h1>Protagonist</h1><p id="status" role="status">Opening your space…</p><button id="retry" hidden>Try again</button><p><a href="/chat">Back to Simulator</a></p><noscript>Enable JavaScript to open your personal space.</noscript></main><script>
(()=>{const fragment=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search),t=fragment.get('t')||query.get('t')||'',section=fragment.get('section')||'';history.replaceState(null,'','/me/login');
const open=async()=>{document.getElementById('retry').hidden=true;try{const r=await fetch('/me/login',{method:'POST',headers:{'Content-Type':'application/json','X-Protagonist':'1'},body:JSON.stringify({t,section})});const d=await r.json();if(!r.ok)throw Error(d.error);location.replace(d.url);}catch(e){document.getElementById('status').textContent=e.message||'Could not connect. Please try again.';document.getElementById('retry').hidden=false;}};document.getElementById('retry').onclick=open;open();})();
</script></body></html>
